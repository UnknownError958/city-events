<!DOCTYPE html> 
<html lang="uk"> 

<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    
    <title>Афіша подій міста</title> 
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css"> 

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script src="js/script.js" defer></script>
</head> 

<body> 
    <div id="app">
        <header class="site-header">
            <h1>Афіша подій міста</h1>
            <nav>
                <a href="#events">Події</a>
                <a href="#selected-event">Обрана подія</a>
            </nav>
        </header>
        <div class="layout container">
            <main>
                <section id="filter">
                    <h2>Фільтр за датою/категорією</h2>
                    <div id="filter-btn-container" style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="filter-btn" @click="selectedCategory = 'Всі'">Всі події</button>
                        <button class="filter-btn" @click="selectedCategory = 'Музика'">Музика</button>
                        <button class="filter-btn" @click="selectedCategory = 'Театр'">Театр</button>
                        <button class="filter-btn" @click="selectedCategory = 'Виставка'">Виставка</button>
                        <button class="filter-btn" @click="selectedCategory = 'Спорт'">Спорт</button>
                        <button class="filter-btn" @click="selectedCategory = 'Свято'">Свята</button>
                    </div>
                </section>

                <section id="events">
                    <h2>Події</h2>
                    <p>Загальна кількість подій: {{ filteredEvents.length }}</p>
                    <p v-if="loading" style="color: #ccff00;">Завантаження даних...</p>
                    <p v-if="error" style="color: #ff0055; font-weight: bold;">{{ error }}</p>
                    <button id="reload-btn" @click="reloadEvents" style="margin-bottom: 20px;">Завантажити події</button>
                    <div class="cards" id="events-list">
                        <event-card 
                            v-for="event in filteredEvents" 
                            :key="event.id"
                            :title="event.title"
                            :category="event.category"
                            :date="event.date">
                        </event-card>
                    </div>
                    
                    <form id="add-event-form" @submit.prevent="addEvent">
                        <input type="text" id="title" v-model="newEvent.title" required>
                        <select id="category" v-model="newEvent.category">
                            <option value="Музика">Музика</option>
                            <option value="Театр">Театр</option>
                            <option value="Виставка">Виставка</option>
                            <option value="Спорт">Спорт</option>
                            <option value="Свято">Свято</option>
                        </select>
                        <input type="date" id="date" v-model="newEvent.date" required>
                        <button type="submit">Додати подію</button>
                    </form>
                </section>

            </main>

            <aside id="selected-event">
                <div class="container">
                    <h2>Деталі обраної події</h2>
                </div>
            </aside>
        </div>
        <footer>
            <div class="container">
                <p>Контакти організаторів:</p>
            </div>
        </footer>
    </div>
</body> 
</html>
